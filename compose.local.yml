# 로컬 기동용 구성 (M0)
# 실행: cp .env.example .env  →  docker compose -f compose.local.yml up -d --build
# 원본은 EC2에서 docker run -e ... 로 띄웠다. 여기서는 의존 서비스까지 한 파일로 묶는다.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jjhg
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 호환 오브젝트 스토리지 (RustFS, Apache-2.0)
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # 앱이 ap-northeast-2로 서명하므로 리전을 맞춘다 (기본값 us-east-1)
      RUSTFS_REGION: ap-northeast-2
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    volumes:
      - s3-data:/data

  # 버킷을 한 번 만들고 끝나는 일회성 컨테이너. 특정 제품의 CLI 대신 AWS CLI를 써서
  # 스토리지를 바꿔도 이 부분은 그대로 쓴다
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ap-northeast-2
      S3_BUCKET: ${S3_BUCKET}
    # 스토리지가 뜰 때까지 재시도하고, 버킷이 없을 때만 만든다
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do sleep 2; done;
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $${S3_BUCKET} 2>/dev/null
      || aws --endpoint-url http://rustfs:9000 s3 mb s3://$${S3_BUCKET}
      "

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # DB·Redis는 compose 서비스 이름으로 찾는다
      DEV_DB_URL: jdbc:mysql://mysql:3306/jjhg?serverTimezone=UTC
      DEV_DB_USERNAME: root
      DEV_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DEV_REDIS_HOST: redis
      DEV_REDIS_PORT: 6379
      DEV_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DEV_REDIS_INVITE_KEY: "contract:invite:"
      DEV_REDIS_SUPERVISORS_KEY: "contract:supervisors:"
      DEV_JWT_SECRET_KEY: ${JWT_SECRET}
      DEV_JWT_ACCESS_EXPIRATION: 30m
      DEV_JWT_REFRESH_EXPIRATION: 14d
      # 소셜 로그인은 쓰지 않는다(테스트 토큰은 scripts/issue-test-token.sh). 값만 비워 둔다
      DEV_OAUTH_KAKAO_CLIENT_ID: ""
      DEV_OAUTH_KAKAO_CLIENT_SECRET: ""
      DEV_OAUTH_NAVER_CLIENT_ID: ""
      DEV_OAUTH_NAVER_CLIENT_SECRET: ""
      DEV_INVITE_URL_PREFIX: http://localhost:8080/api/invite/
      DEV_CORS_ORIGINS: http://localhost:3000
      # Firebase는 호출하는 곳이 없다. 없는 경로를 주면 오류 로그만 남고 기동은 계속된다
      DEV_FCM_KEY_PATH: file:/nonexistent/fcm-key.json
      # RustFS를 S3처럼 쓴다. presigned URL은 호스트(브라우저·curl)가 접속할 주소로 만들어야 하므로 localhost
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_S3_BUCKET_DEV: ${S3_BUCKET}
      S3_ENDPOINT: http://localhost:9000

volumes:
  mysql-data:
  s3-data:
