# 버킷을 한 번 만들고 끝나는 Job (compose의 s3-init과 같은 역할)
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-bucket-init
  namespace: jjhg
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: jjhg-secrets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: jjhg-secrets
                  key: S3_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2
            - name: S3_BUCKET
              value: jjhg-local
          command: ["/bin/sh", "-c"]
          # 저장소가 뜰 때까지 기다렸다가, 버킷이 없을 때만 만든다
          args:
            - |
              EP=http://rustfs.jjhg.svc.cluster.local:9000
              until aws --endpoint-url "$EP" s3 ls >/dev/null 2>&1; do echo "waiting for rustfs"; sleep 3; done
              aws --endpoint-url "$EP" s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null \
                || aws --endpoint-url "$EP" s3 mb "s3://$S3_BUCKET"
              aws --endpoint-url "$EP" s3 ls
