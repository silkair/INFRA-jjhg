# Redis 7.2 — StatefulSet + PVC
# appendonly(AOF)를 켜서 재시작해도 데이터가 디스크에서 복구되게 한다
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jjhg
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: jjhg
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jjhg-secrets
                  key: REDIS_PASSWORD
          # $(REDIS_PASSWORD)는 쿠버네티스가 위 env 값으로 바꿔 넣는다
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
