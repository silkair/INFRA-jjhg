# 진짜할게 API — Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jjhg-api
  namespace: jjhg
spec:
  # replicas는 두지 않는다. 파드 수는 HPA(hpa.yaml)가 2~4개 사이에서 정한다
  selector:
    matchLabels:
      app: jjhg-api
  template:
    metadata:
      labels:
        app: jjhg-api
      annotations:
        config-rev: "3"
    spec:
      # 종료 순서: preStop 10초 대기 → SIGTERM → Spring 정상 종료(최대 30초). 합계보다 넉넉하게 45초
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: jjhg-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/silkair/infra-jjhg:sha-dc2bc6f
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: jjhg-api-config
          env:
            - name: DEV_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: jjhg-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: DEV_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: jjhg-secrets, key: REDIS_PASSWORD }
            - name: DEV_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: jjhg-secrets, key: JWT_SECRET }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: jjhg-secrets, key: S3_ACCESS_KEY }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: jjhg-secrets, key: S3_SECRET_KEY }
          # 파드가 종료될 때 바로 내려가지 않고 10초 기다린다.
          # 그동안 Envoy·Service가 이 파드를 대상에서 빼므로, 종료 중인 파드로 요청이 가서
          # "Connection refused"(503)가 나는 것을 막는다 (B1-3 drain 측정에서 확인)
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          # 기동이 느린 Java 앱: 첫 기동은 최대 3분까지 기다린다
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          # 준비 여부: DB·Redis까지 포함한 health가 UP일 때만 트래픽을 받는다
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
          # 생존 여부: 프로세스가 포트를 열고 있는지만 본다.
          # DB가 잠깐 죽었다고 앱을 재시작하면 문제만 커지므로 health를 쓰지 않는다
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jjhg-api
  namespace: jjhg
  labels:
    app: jjhg-api
spec:
  selector:
    app: jjhg-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
