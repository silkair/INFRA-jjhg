# 진짜할게 API 지표 수집 대상 등록
# Prometheus Operator가 이 객체를 읽어 Prometheus 수집 설정을 자동으로 만든다
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jjhg-api
  namespace: jjhg
spec:
  selector:
    matchLabels:
      app: jjhg-api          # 이 라벨이 붙은 Service를 찾는다 (app.yaml의 Service에 추가한 라벨)
  endpoints:
    - port: http             # Service의 포트 이름 (번호가 아니라 이름으로 지정)
      path: /actuator/prometheus
      interval: 30s
