# MySQL 8.0 — StatefulSet + PVC
# compose의 mysql 서비스를 옮긴 것. 데이터는 PVC(local-path)에 남는다
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: jjhg
spec:
  clusterIP: None            # headless: 파드 이름(mysql-0.mysql)으로 직접 찾게 한다
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: jjhg
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jjhg-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: jjhg
            - name: TZ
              value: UTC
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:     # 접속을 받을 준비가 됐을 때만 트래픽을 받는다
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:      # 파드마다 PVC를 하나씩 만든다 (data-mysql-0)
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
