# 진짜할게 API 대시보드
# Grafana sidecar가 라벨 grafana_dashboard=1 인 ConfigMap을 찾아 대시보드로 읽어 들인다
# (monitoring-values.yaml의 sidecar searchNamespace: ALL 덕분에 jjhg 네임스페이스에 둬도 된다)
apiVersion: v1
kind: ConfigMap
metadata:
  name: jjhg-dashboard
  namespace: jjhg
  labels:
    grafana_dashboard: "1"
data:
  jjhg-api.json: |
    {
      "uid": "jjhg-api",
      "title": "진짜할게 API",
      "tags": [
        "jjhg"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "schemaVersion": 39,
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "앱 수집 상태 (1 = UP)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=\"jjhg-api\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "파드 재시작 횟수",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"jjhg\", container=\"api\"})"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx 비율 (최근 5분)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"jjhg\", uri!~\"/actuator.*\", status=~\"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"jjhg\", uri!~\"/actuator.*\"}[5m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p95 응답 시간 (최근 5분)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"jjhg\", uri!~\"/actuator.*\"}[5m])))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "초당 요청 수 (경로별)",
          "description": "probe·지표 수집(/actuator)은 제외",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{namespace=\"jjhg\", uri!~\"/actuator.*\"}[$__rate_interval]))",
              "legendFormat": "{{uri}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "응답 코드별 초당 요청 수",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"jjhg\", uri!~\"/actuator.*\"}[$__rate_interval]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "응답 시간 p50 · p95",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"jjhg\", uri!~\"/actuator.*\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"jjhg\", uri!~\"/actuator.*\"}[$__rate_interval])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "메모리: JVM 힙 사용량 · 컨테이너 사용량 · 제한",
          "description": "컨테이너 사용량이 제한에 닿으면 OOMKilled",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(jvm_memory_used_bytes{namespace=\"jjhg\", area=\"heap\"})",
              "legendFormat": "JVM 힙 사용"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"jjhg\", container=\"api\"})",
              "legendFormat": "컨테이너 사용 (working set)"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(kube_pod_container_resource_limits{namespace=\"jjhg\", container=\"api\", resource=\"memory\"})",
              "legendFormat": "제한 (limit)"
            }
          ]
        },
        {
          "id": 9,
          "type": "row",
          "title": "성능 진단",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "DB 커넥션 풀: 사용 중 · 대기 · 최대",
          "description": "대기 중인 요청이 0보다 크면 커넥션이 모자란 상태",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(hikaricp_connections_active{namespace=\"jjhg\"})",
              "legendFormat": "사용 중"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(hikaricp_connections_pending{namespace=\"jjhg\"})",
              "legendFormat": "대기 중인 요청"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(hikaricp_connections_max{namespace=\"jjhg\"})",
              "legendFormat": "최대"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "커넥션 대기 시간 · 점유 시간 (평균)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(hikaricp_connections_acquire_seconds_sum{namespace=\"jjhg\"}[$__rate_interval])) / sum(rate(hikaricp_connections_acquire_seconds_count{namespace=\"jjhg\"}[$__rate_interval]))",
              "legendFormat": "커넥션을 얻기까지"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(hikaricp_connections_usage_seconds_sum{namespace=\"jjhg\"}[$__rate_interval])) / sum(rate(hikaricp_connections_usage_seconds_count{namespace=\"jjhg\"}[$__rate_interval]))",
              "legendFormat": "커넥션을 쥐고 있는 시간"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "노드별 CPU 사용률",
          "description": "노드가 100% 가까우면 그 노드의 파드가 모두 느려진다",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval]))) * on (instance) group_left (nodename) node_uname_info",
              "legendFormat": "{{nodename}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "파드별 CPU (상위 8)",
          "description": "단위: 코어",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 29,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(8, sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\"}[$__rate_interval])))",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "요청 1건당 커넥션 획득 횟수",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 37,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(hikaricp_connections_acquire_seconds_count{namespace=\"jjhg\"}[$__rate_interval])) / sum(rate(http_server_requests_seconds_count{namespace=\"jjhg\", uri!~\"/actuator.*\"}[$__rate_interval]))",
              "legendFormat": "획득 횟수 / 요청"
            }
          ]
        }
      ]
    }
