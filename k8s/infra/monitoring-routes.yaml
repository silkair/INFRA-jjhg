# 관측 화면 3개를 Gateway 뒤에 둔다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: jjhg-gateway
      namespace: jjhg
  hostnames: ["grafana.jjhg.local"]
  rules:
    - backendRefs:
        - name: kps-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: jjhg-gateway
      namespace: jjhg
  hostnames: ["prometheus.jjhg.local"]
  rules:
    - backendRefs:
        - name: kps-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: jjhg-gateway
      namespace: jjhg
  hostnames: ["alertmanager.jjhg.local"]
  rules:
    - backendRefs:
        - name: kps-alertmanager
          port: 9093
