# kube-prometheus-stack Helm 값 (worker 6GB 2대에 맞춘 가벼운 설정)
# 설치: helm install kps prometheus-community/kube-prometheus-stack --version <버전> -n monitoring -f monitoring-values.yaml

# 리소스 이름을 짧게: kps-prometheus, kps-alertmanager ...
fullnameOverride: kps

grafana:
  admin:
    existingSecret: grafana-admin     # 비밀번호는 Git에 두지 않고 직접 만든 Secret에서 읽는다
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL            # 다른 네임스페이스(jjhg)의 대시보드 ConfigMap도 불러온다

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1536Mi }
    # 아래 세 줄: Helm 릴리스 라벨이 없는 ServiceMonitor·PrometheusRule도 찾게 한다
    # (우리 앱의 수집 설정과 알림 규칙은 Git의 k8s/에 두고 ArgoCD가 배포하므로)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:                      # 지표를 PVC에 저장해 Prometheus가 재시작돼도 남게
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
    secrets:
      - alertmanager-discord   # /etc/alertmanager/secrets/alertmanager-discord/webhook-url
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog: 경보 경로가 살아 있는지 보려고 항상 켜 두는 알림 → 보내지 않는다
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: "null"
          matchers: ['alertname = "InfoInhibitor"']
        # 나머지 warning·critical (앱 알림 + 차트 기본 클러스터 알림)
        - receiver: discord
          matchers: ['severity =~ "warning|critical"']
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true         # 해결되면 해결 메시지도 보낸다
    inhibit_rules:
      # 같은 알림이 critical로 울리고 있으면 warning은 보내지 않는다
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [namespace, alertname]

# kubeadm은 아래 구성 요소의 지표 포트를 127.0.0.1에만 열어 둔다.
# 그대로 두면 수집이 실패해 "Down" 알림이 계속 울리므로 이번 범위에서는 수집하지 않는다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
