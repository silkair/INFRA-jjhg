# 앱 설정 중 비밀이 아닌 값 (compose의 environment: 중 비밀번호를 뺀 나머지)
apiVersion: v1
kind: ConfigMap
metadata:
  name: jjhg-api-config
  namespace: jjhg
data:
  SPRING_PROFILES_ACTIVE: dev
  # DB·Redis는 클러스터 안 Service 이름으로 찾는다 (<서비스>.<네임스페이스>.svc.cluster.local)
  DEV_DB_URL: jdbc:mysql://mysql.jjhg.svc.cluster.local:3306/jjhg?serverTimezone=UTC
  DEV_DB_USERNAME: root
  DEV_REDIS_HOST: redis.jjhg.svc.cluster.local
  DEV_REDIS_PORT: "6379"
  DEV_REDIS_INVITE_KEY: "contract:invite:"
  DEV_REDIS_SUPERVISORS_KEY: "contract:supervisors:"
  DEV_JWT_ACCESS_EXPIRATION: 30m
  DEV_JWT_REFRESH_EXPIRATION: 14d
  # 소셜 로그인은 쓰지 않는다 (테스트 토큰 스크립트로 대신)
  DEV_OAUTH_KAKAO_CLIENT_ID: ""
  DEV_OAUTH_KAKAO_CLIENT_SECRET: ""
  DEV_OAUTH_NAVER_CLIENT_ID: ""
  DEV_OAUTH_NAVER_CLIENT_SECRET: ""
  DEV_INVITE_URL_PREFIX: http://jjhg.local/api/invite/
  DEV_CORS_ORIGINS: http://localhost:3000
  # Firebase는 호출하는 곳이 없다. 없는 경로를 주면 오류 로그만 남기고 기동한다
  DEV_FCM_KEY_PATH: file:/nonexistent/fcm-key.json
  AWS_S3_BUCKET_DEV: jjhg-local
  # presigned URL은 클러스터 바깥(노트북)이 접속할 주소로 만들어야 한다. ⑤에서 Ingress로 연결한다
  S3_ENDPOINT: http://s3.jjhg.local
  # JVM이 컨테이너 메모리 제한의 75%까지 힙으로 쓰게 한다 (기본 25%는 이 제한에서 너무 작다)
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
