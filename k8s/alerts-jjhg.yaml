# 진짜할게 API SLO · 알림 규칙
# Prometheus Operator가 이 객체를 읽어 Prometheus 규칙 파일로 넣는다
# (monitoring-values.yaml의 ruleSelectorNilUsesHelmValues: false 덕분에 jjhg 네임스페이스에 둬도 읽는다)
#
# SLO: 사용자 요청(/actuator 제외)의 99%가 5xx 없이 응답한다. 기간은 7일(Prometheus 보관 기간과 같음)
#      → 오류 예산 = 7일 동안 요청의 1%
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jjhg-api
  namespace: jjhg
spec:
  groups:
    # 1) 기록 규칙: 자주 쓰는 계산을 미리 해 두고 이름을 붙인다 (알림·대시보드가 같은 값을 쓴다)
    - name: jjhg-api.recording
      rules:
        - record: jjhg:requests:rate5m
          expr: sum(rate(http_server_requests_seconds_count{namespace="jjhg", uri!~"/actuator.*"}[5m]))
        - record: jjhg:errors:rate5m
          expr: sum(rate(http_server_requests_seconds_count{namespace="jjhg", uri!~"/actuator.*", status=~"5.."}[5m])) or vector(0)
        - record: jjhg:error_ratio:rate5m
          expr: jjhg:errors:rate5m / jjhg:requests:rate5m
        - record: jjhg:latency_p95:rate5m
          expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace="jjhg", uri!~"/actuator.*"}[5m])))
        # SLO 7일 성공률과 남은 오류 예산 (1 = 예산 그대로, 0 = 다 씀, 음수 = 초과)
        - record: jjhg:availability:ratio_7d
          expr: |
            1 - (
              (sum(increase(http_server_requests_seconds_count{namespace="jjhg", uri!~"/actuator.*", status=~"5.."}[7d])) or vector(0))
              /
              sum(increase(http_server_requests_seconds_count{namespace="jjhg", uri!~"/actuator.*"}[7d]))
            )
        - record: jjhg:error_budget_remaining:ratio_7d
          expr: 1 - (1 - jjhg:availability:ratio_7d) / 0.01

    # 2) 알림 규칙
    - name: jjhg-api.alerts
      rules:
        # 앱 지표를 가져올 수 없음. 파드가 0개면 up 시계열 자체가 사라지므로 or vector(0)으로 0을 만든다
        - alert: JjhgApiDown
          expr: (sum(up{job="jjhg-api"}) or vector(0)) < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: 진짜할게 API 지표 수집 실패 (파드 없음 또는 응답 없음)

        # 오류율 5% 초과가 5분 지속. 요청이 거의 없을 때는 1건 오류로도 100%가 되므로 분당 3건 이상일 때만 본다
        - alert: JjhgApiHighErrorRate
          expr: jjhg:error_ratio:rate5m > 0.05 and jjhg:requests:rate5m > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '진짜할게 API 5xx 비율 {{ $value | humanizePercentage }} (기준 5%)'

        # p95 응답 시간 500ms 초과가 5분 지속. 같은 이유로 최소 요청 수 조건을 둔다
        - alert: JjhgApiHighLatency
          expr: jjhg:latency_p95:rate5m > 0.5 and jjhg:requests:rate5m > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '진짜할게 API p95 응답 시간 {{ $value | humanizeDuration }} (기준 500ms)'
